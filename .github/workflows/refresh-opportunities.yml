name: Refresh opportunities

# Re-scrapes the public sources and commits data/opportunities/snapshot.json.
# Runs every 6 hours (Remotive asks for at most 4 requests/day, and every source has its own minimum interval),
# and on demand from the Actions tab ("Run workflow", optionally forcing a fetch of every source).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore each source's minimum interval"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-opportunities
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape
        id: scrape
        run: |
          set -o pipefail
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          npm run scrape -- $FORCE 2>&1 | tee scrape.log

      - name: Show the result on the run page
        if: always()
        run: |
          {
            echo '### Opportunity sources'
            echo '```'
            sed -n '/^Source /,$p' scrape.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sanity-check the snapshot before committing it
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("data/opportunities/snapshot.json", "utf8"));
            if (!Array.isArray(s.items) || s.items.length < 10) { console.error("Refusing to commit: only", s.items && s.items.length, "items"); process.exit(1); }
            console.log("Snapshot OK:", s.items.length, "items from", s.sources.length, "sources, generated", s.generatedAt);
          '

      - name: Commit the refreshed snapshot
        run: |
          git config user.name "raahi-bot"
          git config user.email "raahi-bot@users.noreply.github.com"
          git add data/opportunities/snapshot.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # [skip ci]: data refreshes must not trigger redeploys. Production reads the latest snapshot at runtime
          # (see OPPORTUNITIES_SNAPSHOT_URL in the README); the next normal deploy bundles it too.
          git commit -m "chore(data): refresh opportunities snapshot [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
