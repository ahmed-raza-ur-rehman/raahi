name: Check directory links

# Weekly: request every URL in data/opportunities/resources.ts and record the result in
# data/opportunities/link-health.json (shown as "link confirmed / may be broken" badges in the app).
# The run fails — and GitHub emails you — only when links are truly broken (404/410/5xx/unreachable);
# sites that merely refuse bots (403/429) are reported as "blocked", not broken.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check links
        id: check
        continue-on-error: true
        run: npm run check-links

      - name: Commit results
        run: |
          git config user.name "raahi-bot"
          git config user.email "raahi-bot@users.noreply.github.com"
          git add data/opportunities/link-health.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "chore(data): update link health [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if links are broken
        if: steps.check.outcome == 'failure'
        run: |
          echo "One or more directory links are broken — see the annotations above and fix data/opportunities/resources.ts."
          exit 1
