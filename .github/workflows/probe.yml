name: Live probe (temporary)

# TEMPORARY — removed before this branch is merged.
# Runs the real scrapers plus a source-discovery sweep on GitHub's runners (normal internet access) and
# commits the evidence under .probe/ so parsers can be tuned against real responses. It only runs when
# `.github/probe-trigger` changes, so ordinary pushes never trigger it.
on:
  push:
    branches: [arena/e85add2f-raahi]
    paths: [".github/probe-trigger"]

permissions:
  contents: write

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Probe
        env:
          PROBE_OUT: .probe/r3
          PROBE_STEPS: scrape,links
        run: |
          set -o pipefail
          npx tsx scripts/probe.ts 2>&1 | tee probe.log

      - name: Summary on the run page
        if: always()
        run: |
          {
            echo '### Probe log (tail)'
            echo '```'
            tail -n 120 probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the evidence
        if: always()
        run: |
          mkdir -p .probe
          mkdir -p .probe/r3 && cp probe.log .probe/r3/probe.log || true
          git config user.name "raahi-bot"
          git config user.email "raahi-bot@users.noreply.github.com"
          git add -f .probe
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(probe): live probe results [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
