name: Android toolchain probe (temporary)

# TEMPORARY - removed before this branch is merged.
# GitHub's runners have the Android SDK, JDKs and unrestricted Maven access; the authoring sandbox has none of
# them. This job records what the runner provides and the latest *stable* version of every artifact the Android
# app may use, and commits the evidence under .probe/android/ so versions are chosen from facts, not memory.
# It only runs when `.github/probe-trigger-android` changes.
on:
  push:
    branches: [arena/e85add2f-raahi]
    paths: [".github/probe-trigger-android"]

permissions:
  contents: write

concurrency:
  group: android-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Runner toolchain
        run: |
          mkdir -p .probe/android
          {
            echo "## os"; grep PRETTY_NAME /etc/os-release
            echo "## java"; java -version 2>&1; ls /usr/lib/jvm 2>/dev/null; env | grep -E '^JAVA_HOME' || true
            echo "## gradle"; (gradle -v 2>&1 | head -12) || echo "no gradle"
            echo "## android env"; env | grep -E '^ANDROID' || true
            echo "## platforms"; ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1
            echo "## build-tools"; ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>&1
            echo "## cmdline-tools"; ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" 2>&1
            echo "## ndk"; ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" 2>&1
            echo "## emulator/system-images"; ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/system-images" 2>&1 || true
            echo "## node"; node -v; npm -v
            echo "## cpu/mem"; nproc; free -m | head -2
            echo "## kvm"; ls -l /dev/kvm 2>&1 || true
          } > .probe/android/runner.txt 2>&1
          cat .probe/android/runner.txt

      - name: Latest stable versions
        run: |
          python3 - <<'PY' | tee .probe/android/versions.txt
          import re, urllib.request, xml.etree.ElementTree as ET
          GOOGLE = "https://dl.google.com/dl/android/maven2/"
          CENTRAL = "https://repo1.maven.org/maven2/"
          PORTAL = "https://plugins.gradle.org/m2/"
          arts = [
            (GOOGLE, "com/android/tools/build/gradle"),
            (GOOGLE, "androidx/compose/compose-bom"),
            (GOOGLE, "androidx/room/room-runtime"),
            (GOOGLE, "androidx/room/room-compiler"),
            (GOOGLE, "androidx/work/work-runtime-ktx"),
            (GOOGLE, "androidx/navigation/navigation-compose"),
            (GOOGLE, "androidx/lifecycle/lifecycle-runtime-compose"),
            (GOOGLE, "androidx/lifecycle/lifecycle-viewmodel-compose"),
            (GOOGLE, "androidx/activity/activity-compose"),
            (GOOGLE, "androidx/datastore/datastore-preferences"),
            (GOOGLE, "androidx/core/core-ktx"),
            (GOOGLE, "androidx/core/core-splashscreen"),
            (GOOGLE, "androidx/appcompat/appcompat"),
            (GOOGLE, "androidx/test/ext/junit"),
            (GOOGLE, "androidx/compose/ui/ui-test-junit4"),
            (GOOGLE, "androidx/compose/material3/material3"),
            (GOOGLE, "androidx/browser/browser"),
            (GOOGLE, "androidx/security/security-crypto"),
            (CENTRAL, "org/jetbrains/kotlin/kotlin-stdlib"),
            (CENTRAL, "org/jetbrains/kotlin/kotlin-gradle-plugin"),
            (CENTRAL, "org/jetbrains/kotlinx/kotlinx-coroutines-core"),
            (CENTRAL, "org/jetbrains/kotlinx/kotlinx-coroutines-test"),
            (CENTRAL, "org/jetbrains/kotlinx/kotlinx-serialization-json"),
            (CENTRAL, "org/jetbrains/kotlinx/kotlinx-datetime"),
            (CENTRAL, "com/squareup/okhttp3/okhttp"),
            (CENTRAL, "com/squareup/okhttp3/mockwebserver"),
            (CENTRAL, "app/cash/turbine/turbine"),
            (CENTRAL, "org/robolectric/robolectric"),
            (CENTRAL, "junit/junit"),
            (CENTRAL, "io/mockk/mockk"),
            (CENTRAL, "com/google/devtools/ksp/symbol-processing-gradle-plugin"),
            (CENTRAL, "io/gitlab/arturbosch/detekt/detekt-gradle-plugin"),
            (CENTRAL, "org/jlleitschuh/gradle/ktlint-gradle"),
            (PORTAL, "com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin"),
            (PORTAL, "org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin"),
            (PORTAL, "org/jetbrains/kotlin/plugin/serialization/org.jetbrains.kotlin.plugin.serialization.gradle.plugin"),
            (PORTAL, "io/gitlab/arturbosch/detekt/io.gitlab.arturbosch.detekt.gradle.plugin"),
            (PORTAL, "org/jetbrains/kotlin/android/org.jetbrains.kotlin.android.gradle.plugin"),
          ]
          pre = re.compile(r"(alpha|beta|rc|dev|eap|m\d|snapshot|-\d{8})", re.I)
          for base, path in arts:
              url = f"{base}{path}/maven-metadata.xml"
              try:
                  data = urllib.request.urlopen(url, timeout=30).read()
                  root = ET.fromstring(data)
                  versions = [v.text for v in root.iter("version")]
                  stable = [v for v in versions if not pre.search(v)]
                  print(f"{path.split('/')[-1]:55s} stable-latest={stable[-1] if stable else '-':14s} recent={stable[-4:]}")
              except Exception as e:
                  print(f"{path}  ERROR {e}")
          try:
              data = urllib.request.urlopen("https://services.gradle.org/versions/all", timeout=30).read().decode()
              import json
              vs = [v["version"] for v in json.loads(data) if not v["snapshot"] and not v["nightly"] and not v["releaseNightly"] and not v["activeRc"] and not v["rcFor"] and not v["milestoneFor"]]
              print("gradle stable (newest first):", vs[:8])
          except Exception as e:
              print("gradle versions ERROR", e)
          PY

      - name: Summary on the run page
        if: always()
        run: |
          {
            echo '### Android probe'
            echo '```'
            cat .probe/android/runner.txt | head -80
            cat .probe/android/versions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the evidence
        if: always()
        run: |
          git config user.name "raahi-bot"
          git config user.email "raahi-bot@users.noreply.github.com"
          git add -f .probe
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(probe): android toolchain evidence [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
